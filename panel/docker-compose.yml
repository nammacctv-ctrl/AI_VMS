# One VPS (DigitalOcean, Linode, Hetzner, ...) running the whole stack.
# Nothing publishes a port to the internet: public traffic arrives only through
# the Cloudflare tunnel, so the server needs no open inbound web ports.
#
#   cp .env.example .env   # fill in values (see deploy/README.md)
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      POSTGRES_DB: panel
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel_owner -d panel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    image: ${PANEL_IMAGE_MIGRATE:-namma-panel-migrate:local}
    build: { context: ., target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      MIGRATE_DATABASE_URL: postgres://panel_owner:${DB_OWNER_PASSWORD}@db:5432/panel
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      # lets operator commands print the right links:  docker compose run --rm migrate node scripts/ops.mjs help
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?set PLATFORM_ROOT_DOMAIN}
    restart: "no"
    networks: [internal]

  app:
    image: ${PANEL_IMAGE_APP:-namma-panel-app:local}
    build: { context: ., target: app }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://panel_login:${DB_APP_PASSWORD}@db:5432/panel
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?set PLATFORM_ROOT_DOMAIN}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
      # Keep false: panels are created for customers with the operator tool, not by strangers on the web.
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # Daily backup into ./backups on the server. Copy that folder OFF the server too (see deploy/README.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGUSER: panel_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      PGDATABASE: panel
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UPLOAD_COMMAND: ${BACKUP_UPLOAD_COMMAND:-}
    volumes:
      - ./backups:/backups
      - ./deploy:/deploy:ro
    entrypoint: ["sh", "-c", "while true; do sh /deploy/backup.sh || echo 'BACKUP FAILED'; sleep 86400; done"]
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    networks: [internal]

networks:
  internal: {}

volumes:
  dbdata: {}
